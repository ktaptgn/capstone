  event_costs:
    pm_tire: 1.0
    pm_vehicle_balanced: 1.5
    pm_vehicle_fast_expensive: 2.0
    pm_vehicle_slow_cheap: 0.8
    unmet_demand_penalty_per_load: 2.0
    downtime_cost_per_hour: 0.5
    degradation_cost_per_hi_loss: 0.2
