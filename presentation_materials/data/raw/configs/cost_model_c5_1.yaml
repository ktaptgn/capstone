cost_model:
  unit: normalized_cu

  runtime_fixed_pct:
    personnel: 13.8
    royalty: 9.7
    transport: 6.2

  controllable_variable_pct:
    raw_materials_consumables: 17.8
    third_party_goods_supplies: 5.4

  year_end_accounting_pct:
    depreciation_impairment: 25.0
