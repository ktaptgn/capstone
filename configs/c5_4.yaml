# C5.4 -- JOINT (PM-scheduling + dispatch) on the C5.3/C6 reliability surface, 25-truck C5 mine.
# Final-submission module: the decision target widens from dispatch-only (C5.3) to deciding BOTH
# which trucks/components to send to the PM bay AND which route each truck runs. H0-H4 + H_TIME are
# recast as PM-family x dispatch-family pairs; PPO targets the same decision via the documented
# interface (mine_env/rl_interface_c5_4.py).
#
# Provenance (anti-overclaim): every reliability/cost/route/regime number below is carried over
# VERBATIM from configs/c5_3.yaml (themselves the RL Lab C6 documented values) -- NOT re-tuned.
# The ONLY new parameters are in `pm_scheduling`; each is set from a principled derivation
# (documented inline), explicitly NOT tuned against outcomes.

simulation:
  version: C5.4
  # Hybrid temporal model: C5 daily campaign (horizon_days x 24 hour-steps) carrying a daily
  # demand quota, with C6 hour-resolution reliability (downtime/PM/CM measured in hours).
  horizon_days: 365
  step_hours: 1.0
  seed_control: true
  report_value_multiplier: 1000   # normalized CU -> presentation value (C5 convention)

mine:
  base_reference: "C5.1 capstone (Escondida 0.1-scale) + C6 routes A/B/C"
  truck_count: 25
  payload_ton: 350
  pm_bay_count: 2                 # C6 had 1 bay for 10 trucks; ~2 for 25 keeps PM-bay pressure comparable
  shovel_count: 2
  crusher_count: 1

demand:
  # Capacity-based, scaled x2.5 from C6 (84 loads/day for 10 trucks) to hold per-truck intensity.
  daily_demand_loads: 210
  operating_hours_per_day: 24
  default_grade: 0.008
  ore_ton_per_load: 350
  unmet_demand_terminates: true   # episode ends when daily demand met (C6 model)

# Three routes trade grade/cycle against per-component wear (the dispatch decision surface).
routes:
  A:
    label: short_smooth_low_grade
    grade: 0.006
    capacity_loads_per_day: 88
    cycle_time_factor: 1.0
    tire_wear_multiplier: 1.0
    engine_wear_multiplier: 1.0
    brake_wear_multiplier: 1.0
  B:
    label: long_rough_mid_grade
    grade: 0.008
    capacity_loads_per_day: 75
    cycle_time_factor: 1.4
    tire_wear_multiplier: 1.6
    engine_wear_multiplier: 1.2
    brake_wear_multiplier: 1.1
  C:
    label: steep_heavy_high_grade
    grade: 0.010
    capacity_loads_per_day: 62
    cycle_time_factor: 1.3
    tire_wear_multiplier: 1.3
    engine_wear_multiplier: 1.6
    brake_wear_multiplier: 1.7

reliability:
  components: [tire, engine, brake]
  initial_hi:
    tire: 1.0
    engine: 1.0
    brake: 1.0
  min_hi: 0.0
  max_hi: 1.0

  wear:
    base_loss_per_load:
      tire: 0.004
      engine: 0.003
      brake: 0.003
    stochastic_noise_std:
      tire: 0.0005
      engine: 0.0004
      brake: 0.0004

  # Frailty: per-truck per-component latent wear-rate multiplier ~ Gamma(mean=1, cv).
  frailty:
    enabled: true
    cv: 0.30                       # C6 base CV; the active regime overrides it (heterogeneous_condition -> 0.50)

  # Weibull-like wear-out hazard: 0 above threshold_hi, rising as HI falls below it.
  failure:
    threshold_hi: 0.20
    hazard_scale:
      tire: 0.04
      engine: 0.03
      brake: 0.035
    hazard_shape:
      tire: 2.0
      engine: 2.2
      brake: 2.1

  # Sensor noise on the OBSERVED component HI (POMDP).
  condition_observation:
    noise_enabled: true
    noise_std: 0.03                # base; the active regime overrides it
    clip_to_range: true

cost:
  unit: normalized_CU
  pm:
    tire:   {cost_cu: 2.0, duration_hours: 2.0, recovery: 0.35}
    engine: {cost_cu: 4.0, duration_hours: 4.0, recovery: 0.30}
    brake:  {cost_cu: 2.5, duration_hours: 3.0, recovery: 0.35}
  cm:
    tire:   {cost_cu: 8.0,  duration_hours: 8.0,  recovery: 0.60}
    engine: {cost_cu: 12.0, duration_hours: 12.0, recovery: 0.55}
    brake:  {cost_cu: 9.0,  duration_hours: 10.0, recovery: 0.60}
  degradation:
    tire_hi_loss_cost: 0.5
    engine_hi_loss_cost: 0.8
    brake_hi_loss_cost: 0.6
  downtime:
    downtime_cost_per_hour_cu: 1.0
  demand:
    unmet_load_penalty_cu: 2.0
  idle:
    penalty_cu: 0.05

# Condition-based (CBM) thresholds -- the C6.1 grid-search frozen optimum. In C5.3 this was THE
# fixed PM rule for every policy; in C5.4 it is the trigger of the `condition` PM family only
# (used by H1). Carried over verbatim; not tuned here.
rule_based_pm:
  hi_threshold:
    tire: 0.21
    engine: 0.21
    brake: 0.28
  failure_risk_override: 0.80      # PM regardless of threshold once component risk >= this
  cooldown_steps_per_truck_component: 4

# NEW in C5.4: per-family PM-scheduling parameters. PM is now a DECISION, so each family needs its
# trigger. Anti-overclaim derivations (NOT tuned against results):
#   STEELMANNED BLIND BASELINES. A blind PM does a FULL vehicle service (all 3 components) on a
#   clock. Under frailty cv=0.50 the worst trucks wear ~2.5x faster, so to give the blind baseline
#   its best shot the cadence is sized to the FAST-FRAILTY TAIL, not the average truck:
#     tire steady-state cadence = PM recovery 0.35 / nominal loss (0.004 x regime wear 1.2 = 0.0048)
#     ~= 73 hauls for an average (frailty 1.0) truck; for a frailty ~2.5x tail truck ~= 29 hauls
#     ~= 3 days (at ~8.4 hauls/truck/day). This is also the TIGHTEST feasible calendar given 2 PM
#     bays: full-vehicle services (~9-11h each) saturate the bays at ~1594 visits/yr, so a tighter
#     clock adds no services -- it only improves which trucks the worst-first bay queue catches.
#   A cadence sweep (calendar interval 3->8 days, operating-hours due 24->72) confirms blind >> state-
#   aware on TCO across the ENTIRE range (TCO 35k-50k vs ~22k), so the finding is cadence-ROBUST, not
#   a cadence artifact. iv=8/due=72 is the worst (most strawman) end; these values are the fair end.
pm_scheduling:
  calendar:
    interval_days: 3               # fast-frailty-tail cadence (~29 hauls); tightest feasible given 2 bays
  operating_hours:
    due_hours: 30                  # ~ fast-frailty-tail hauls between full services
  risk_priority:
    risk_threshold: 0.80           # = CBM failure_risk_override: PM components whose risk is critical
  cost_value:
    lookahead_hauls: 24            # one day's operating hours of failure-cost anticipation
  flow_backpressure:
    soft_threshold_hi: 0.30        # only service genuinely worn components, with margin above the 0.20 floor

# Operating regimes (verbatim from c5_3.yaml / c6_regimes.yaml).
default_regime: heterogeneous_condition
regimes:
  heterogeneous_condition:
    wear_multiplier: 1.2
    hazard_multiplier: 1.3
    cm_cost_multiplier: 1.2
    downtime_multiplier: 1.2
    demand_factor: 1.0
    heterogeneity_cv: 0.50
    condition_noise_std: 0.03
  high_stress:
    wear_multiplier: 1.5
    hazard_multiplier: 1.8
    cm_cost_multiplier: 1.3
    downtime_multiplier: 1.3
    demand_factor: 1.0
    heterogeneity_cv: 0.30
    condition_noise_std: 0.03
  high_demand_high_stress:
    wear_multiplier: 1.5
    hazard_multiplier: 1.8
    cm_cost_multiplier: 1.3
    downtime_multiplier: 1.3
    demand_factor: 1.15
    heterogeneity_cv: 0.30
    condition_noise_std: 0.03

# Each policy = (PM-scheduling family, C5.3 dispatch rule). H_TIME is back: with PM a decision again,
# an operating-hours timer is a genuine policy (it had no dispatch-only analogue in C5.3).
policies:
  enabled: [H0, H_TIME, H1, H2, H3, H4]
  rl_enabled: false                # PPO targets mine_env/rl_interface_c5_4.py; trained in the RL Lab
  family_map:
    H0:     {pm: calendar,          dispatch: H0}   # fully blind baseline
    H_TIME: {pm: operating_hours,   dispatch: H0}   # usage-based blind PM
    H1:     {pm: condition,         dispatch: H1}   # CBM PM + health routing
    H2:     {pm: risk_priority,     dispatch: H2}   # risk PM + risk-aware routing
    H3:     {pm: cost_value,        dispatch: H3}   # cost-value PM + value routing
    H4:     {pm: flow_backpressure, dispatch: H4}   # opportunistic PM + capacity routing

evaluation:
  seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110,
          111, 112, 113, 114, 115, 116, 117, 118, 119, 120,
          121, 122, 123, 124, 125, 126, 127, 128, 129, 130]   # 30 held-out eval seeds

outputs:
  log_dir: outputs/c5_4/logs
  summary_dir: outputs/c5_4/summary
