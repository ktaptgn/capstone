# C5.5 -- experimental facility-destination dispatch surface on the C5.4 reliability/PM/cost stack.
# This is not a correction of C5.4. It preserves the C5.4 reliability, cost, frailty, sensor-noise,
# PM-scheduling, policies, regimes, seeds, and normalized-CU objective, but replaces abstract
# Route A/B/C dispatch with C5.1-style facility destination choice.

simulation:
  version: C5.5
  horizon_days: 365
  step_hours: 1.0
  seed_control: true
  report_value_multiplier: 1000

mine:
  base_reference: "C5.4 reliability/PM stack + C5.1-style proxy facility destinations"
  truck_count: 25
  operating_truck_count: 20
  standby_truck_count: 5
  payload_ton: 350
  pm_bay_facility_count: 1
  pm_service_capacity: 2
  shovel_count: 3
  crusher_count: 2

demand:
  daily_demand_loads: 210
  operating_hours_per_day: 24
  default_grade: 0.008
  ore_ton_per_load: 350
  unmet_demand_terminates: true

facilities:
  shovels:
    SHOVEL_A:
      label: Shovel A
      grade_index: 0.90
      hardness_factor: 1.20
      road_profile: far_rough
      capacity_loads_per_day: 72
      cycle_time_factor: 1.35
      tire_wear_multiplier: 1.65
      engine_wear_multiplier: 1.35
      brake_wear_multiplier: 1.20
    SHOVEL_B:
      label: Shovel B
      grade_index: 0.80
      hardness_factor: 1.00
      road_profile: normal
      capacity_loads_per_day: 75
      cycle_time_factor: 1.00
      tire_wear_multiplier: 1.15
      engine_wear_multiplier: 1.10
      brake_wear_multiplier: 1.05
    SHOVEL_C:
      label: Shovel C
      grade_index: 0.70
      hardness_factor: 0.85
      road_profile: near_smooth
      capacity_loads_per_day: 84
      cycle_time_factor: 0.85
      tire_wear_multiplier: 0.80
      engine_wear_multiplier: 0.85
      brake_wear_multiplier: 0.80
  crushers:
    CRUSHER_1:
      label: Crusher 1
      role: closer_lower_capacity
      capacity_loads_per_day: 95
      travel_time_factor: 0.80
      queue_risk_factor: 1.25
      tire_wear_multiplier: 0.85
      engine_wear_multiplier: 0.90
      brake_wear_multiplier: 1.20
    CRUSHER_2:
      label: Crusher 2
      role: farther_higher_capacity
      capacity_loads_per_day: 140
      travel_time_factor: 1.15
      queue_risk_factor: 0.85
      tire_wear_multiplier: 1.15
      engine_wear_multiplier: 1.10
      brake_wear_multiplier: 0.95
  actions:
    empty:
      - SEND_TO_SHOVEL_A
      - SEND_TO_SHOVEL_B
      - SEND_TO_SHOVEL_C
      - SEND_TO_PM_BAY
      - STANDBY
    loaded:
      - SEND_TO_CRUSHER_1
      - SEND_TO_CRUSHER_2
      - EMERGENCY_PM
      - SAFE_STOP

reliability:
  components: [tire, engine, brake]
  initial_hi:
    tire: 1.0
    engine: 1.0
    brake: 1.0
  min_hi: 0.0
  max_hi: 1.0
  wear:
    base_loss_per_load:
      tire: 0.004
      engine: 0.003
      brake: 0.003
    stochastic_noise_std:
      tire: 0.0005
      engine: 0.0004
      brake: 0.0004
  frailty:
    enabled: true
    cv: 0.30
  failure:
    threshold_hi: 0.20
    hazard_scale:
      tire: 0.04
      engine: 0.03
      brake: 0.035
    hazard_shape:
      tire: 2.0
      engine: 2.2
      brake: 2.1
  condition_observation:
    noise_enabled: true
    noise_std: 0.03
    clip_to_range: true

cost:
  unit: normalized_CU
  pm:
    tire:   {cost_cu: 2.0, duration_hours: 2.0, recovery: 0.35}
    engine: {cost_cu: 4.0, duration_hours: 4.0, recovery: 0.30}
    brake:  {cost_cu: 2.5, duration_hours: 3.0, recovery: 0.35}
  cm:
    tire:   {cost_cu: 8.0,  duration_hours: 8.0,  recovery: 0.60}
    engine: {cost_cu: 12.0, duration_hours: 12.0, recovery: 0.55}
    brake:  {cost_cu: 9.0,  duration_hours: 10.0, recovery: 0.60}
  degradation:
    tire_hi_loss_cost: 0.5
    engine_hi_loss_cost: 0.8
    brake_hi_loss_cost: 0.6
  downtime:
    downtime_cost_per_hour_cu: 1.0
  demand:
    unmet_load_penalty_cu: 2.0
  idle:
    penalty_cu: 0.05

rule_based_pm:
  hi_threshold:
    tire: 0.21
    engine: 0.21
    brake: 0.28
  failure_risk_override: 0.80
  cooldown_steps_per_truck_component: 4

pm_scheduling:
  calendar:
    interval_days: 3
  operating_hours:
    due_hours: 30
  risk_priority:
    risk_threshold: 0.80
  cost_value:
    lookahead_hauls: 24
  flow_backpressure:
    soft_threshold_hi: 0.30

default_regime: heterogeneous_condition
regimes:
  heterogeneous_condition:
    wear_multiplier: 1.2
    hazard_multiplier: 1.3
    cm_cost_multiplier: 1.2
    downtime_multiplier: 1.2
    demand_factor: 1.0
    heterogeneity_cv: 0.50
    condition_noise_std: 0.03
  high_stress:
    wear_multiplier: 1.5
    hazard_multiplier: 1.8
    cm_cost_multiplier: 1.3
    downtime_multiplier: 1.3
    demand_factor: 1.0
    heterogeneity_cv: 0.30
    condition_noise_std: 0.03
  high_demand_high_stress:
    wear_multiplier: 1.5
    hazard_multiplier: 1.8
    cm_cost_multiplier: 1.3
    downtime_multiplier: 1.3
    demand_factor: 1.15
    heterogeneity_cv: 0.30
    condition_noise_std: 0.03

policies:
  enabled: [H0, H_TIME, H1, H2, H3, H4]
  rl_enabled: false
  family_map:
    H0:     {pm: calendar,          dispatch: facility_blind}
    H_TIME: {pm: operating_hours,   dispatch: facility_blind}
    H1:     {pm: condition,         dispatch: facility_health}
    H2:     {pm: risk_priority,     dispatch: facility_risk}
    H3:     {pm: cost_value,        dispatch: facility_value}
    H4:     {pm: flow_backpressure, dispatch: facility_flow}

evaluation:
  seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110,
          111, 112, 113, 114, 115, 116, 117, 118, 119, 120,
          121, 122, 123, 124, 125, 126, 127, 128, 129, 130]

outputs:
  log_dir: outputs/c5_5/logs
  summary_dir: outputs/c5_5/summary
  analysis_dir: outputs/c5_5/analysis
